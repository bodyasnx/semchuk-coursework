<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spider-Man: Brand New Day (2026) — multilingual fan portal. Coursework: Development of a Multilingual Website with Language Switching.">
  <meta name="theme-color" content="#090a0f">
  <title data-i18n="meta.title">Spider-Man: Brand New Day — фан-портал</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Перейти до вмісту</a>

  <!-- ===================== HEADER ===================== -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a class="wordmark" href="#hero" data-i18n-aria-label="nav.home" aria-label="На головну">
        <span class="wordmark__accent">Spider-Man</span><span class="wordmark__sep">:</span> Brand New Day
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <ul class="nav__list">
          <li><a class="nav__link" href="#story" data-i18n="nav.story">Сюжет</a></li>
          <li><a class="nav__link" href="#characters" data-i18n="nav.characters">Персонажі</a></li>
          <li><a class="nav__link" href="#production" data-i18n="nav.production">Зйомки</a></li>
          <li><a class="nav__link" href="#box-office" data-i18n="nav.boxoffice">Касові збори</a></li>
        </ul>
      </nav>

      <div class="header__actions">
        <!-- Language switcher -->

        <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="nav"
                data-i18n-aria-label="nav.menu" aria-label="Меню">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
  </main>

  <script src="js/translations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
